  <body>
    <!--
      PROTOTIPO · Widget de sobres coleccionables (futura sección overlay)
      Flujo: sobre → corte → 3 cartas boca abajo → revelado con efectos por rareza.
      Los sonidos se sintetizan con Web Audio (sin archivos).
    -->
    <main class="stage" data-stage>
      <a class="back-link" href="album.html">← Volver al álbum</a>


      <div class="velo" data-velo aria-hidden="true"></div>
      <div class="rays" data-rays aria-hidden="true"></div>
      <div class="rarity-splash" data-splash hidden><span></span></div>

      <!-- SOBRE -->
      <div class="layer pack-layer">
        <button class="pack" data-pack type="button" aria-label="Abrir el sobre coleccionable"></button>
      </div>

      <!-- CARTAS -->
      <div class="layer hand-layer">
        <div class="hand" data-hand aria-label="Cartas obtenidas"></div>
      </div>

      <!-- UI inferior -->
      <div class="bottom-ui">
        <p class="hint" data-hint aria-live="polite">Toca el sobre para abrirlo</p>
        <div class="actions" data-actions hidden>
          <button class="btn btn--ghost" data-reveal-all type="button">Revelar todas</button>
          <button class="btn btn--primary" data-again type="button">Abrir otro sobre</button>
        </div>
      </div>

      <!-- HUD -->
      <div class="hud">
        <a class="hud__album" href="album.html" title="Ver álbum de colección">Álbum</a>
        <button class="hud__btn" data-mute type="button" aria-pressed="false" aria-label="Silenciar sonidos" title="Sonido">🔊</button>
        <span class="hud__count">Sobres abiertos: <b data-opened>0</b></span>
      </div>

      <!-- Controles de prueba: solo con ?debug=1 -->
      <div class="dev" hidden>
        <label>modo prueba:
          <select data-force>
            <option value="">aleatorio</option>
            <option value="rara">garantizar Rara+</option>
            <option value="epica">garantizar Épica+</option>
            <option value="legendaria">garantizar Legendaria</option>
          </select>
        </label>
      </div>

      <!-- Capa de partículas -->
      <canvas class="fx" data-fx aria-hidden="true"></canvas>
    </main>

    <script src="js/sobre-data.js" defer></script>
    <script src="js/sorteo.js" defer></script>
    <script src="js/carta.js" defer></script>
    <script src="js/sobre.js" defer></script>
  </body>
</html>
